name: MISTY - Auto Extract and Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      source_zip:
        description: 'Optional ZIP path/name in the repository (blank = auto-detect)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: misty-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Extract Android project and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      REQUESTED_SOURCE_ZIP: ${{ inputs.source_zip }}

    steps:
      - name: Checkout repository (including committed ZIP)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # v4 avoids the removed legacy Android SDK "tools" package.
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Find and safely extract Android source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os, re, shutil, zipfile
          from pathlib import Path, PurePosixPath

          repo = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          out = Path(os.environ['RUNNER_TEMP']) / 'misty-project'
          requested = os.environ.get('REQUESTED_SOURCE_ZIP', '').strip()

          def find_project_prefix(names):
              files = {str(PurePosixPath(n)) for n in names if n and not n.endswith('/')}
              for item in sorted(files):
                  p = PurePosixPath(item)
                  if p.name != 'gradlew':
                      continue
                  root = p.parent
                  settings = (str(root / 'settings.gradle') in files or
                              str(root / 'settings.gradle.kts') in files)
                  app_gradle = (str(root / 'app/build.gradle') in files or
                                str(root / 'app/build.gradle.kts') in files)
                  wrapper = str(root / 'gradle/wrapper/gradle-wrapper.jar') in files
                  if settings and app_gradle and wrapper:
                      return root
              return None

          candidates = []
          for z in repo.rglob('*.zip'):
              if '.git' in z.parts or not z.is_file():
                  continue
              try:
                  with zipfile.ZipFile(z) as archive:
                      prefix = find_project_prefix(archive.namelist())
                      if prefix is not None:
                          candidates.append((z, prefix, len(archive.namelist())))
              except (zipfile.BadZipFile, OSError):
                  print(f'Skipping invalid ZIP: {z.relative_to(repo)}')

          chosen = None
          if requested:
              matches = [c for c in candidates
                         if str(c[0].relative_to(repo)) == requested or c[0].name == requested]
              if not matches:
                  raise SystemExit(f'Selected ZIP not found or not a complete Android project: {requested}')
              chosen = max(matches, key=lambda c: c[2])
          elif candidates:
              # Prefer the explicitly recommended filename, then a MISTY/Jarvis/Android name.
              def score(c):
                  name = c[0].name.lower()
                  exact = name == 'misty-android-project.zip'
                  branded = bool(re.search(r'misty|jarvis|android|source', name))
                  return (exact, branded, c[2], c[0].stat().st_size)
              chosen = max(candidates, key=score)

          shutil.rmtree(out, ignore_errors=True)
          out.mkdir(parents=True, exist_ok=True)

          if chosen:
              archive_path, prefix, _ = chosen
              print(f'Selected source ZIP: {archive_path.relative_to(repo)}')
              print(f'Project root inside ZIP: {prefix}')
              with zipfile.ZipFile(archive_path) as archive:
                  for info in archive.infolist():
                      member = PurePosixPath(info.filename)
                      if member.is_absolute() or '..' in member.parts:
                          raise SystemExit(f'Refusing unsafe ZIP entry: {info.filename}')
                      destination = (out / Path(*member.parts)).resolve()
                      if out.resolve() not in destination.parents and destination != out.resolve():
                          raise SystemExit(f'Refusing unsafe ZIP destination: {info.filename}')
                      if info.is_dir():
                          destination.mkdir(parents=True, exist_ok=True)
                      else:
                          destination.parent.mkdir(parents=True, exist_ok=True)
                          with archive.open(info) as src, destination.open('wb') as dst:
                              shutil.copyfileobj(src, dst)
              project = (out / Path(*prefix.parts)).resolve()
          else:
              # Fallback: build a project that was already extracted and committed to the repo.
              print('No valid source ZIP found; checking extracted project files.')
              wrappers = [p for p in repo.rglob('gradlew')
                          if '.git' not in p.parts and 'build' not in p.parts]
              if not wrappers:
                  raise SystemExit('No complete Android ZIP or gradlew found. Upload and commit the Android project ZIP to the repository root.')
              project = wrappers[0].parent

          required = [
              project / 'gradlew',
              project / 'gradle/wrapper/gradle-wrapper.jar',
              project / 'gradle/wrapper/gradle-wrapper.properties',
              project / 'app/build.gradle.kts',
              project / 'app/src/main/AndroidManifest.xml',
          ]
          settings_ok = ((project / 'settings.gradle').is_file() or
                         (project / 'settings.gradle.kts').is_file())
          missing = [str(p.relative_to(project)) for p in required if not p.is_file()]
          if not settings_ok:
              missing.append('settings.gradle(.kts)')
          if missing:
              raise SystemExit('Incomplete Android project. Missing: ' + ', '.join(missing))

          os.chmod(project / 'gradlew', 0o755)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'MISTY_PROJECT_DIR={project}\n')
          print(f'Validated Android project at: {project}')
          PY

      - name: Install Android SDK, NDK and CMake required by this source
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null
          install_android_packages() {
            sdkmanager --install \
              "platforms;android-35" \
              "build-tools;35.0.0" \
              "platform-tools" \
              "ndk;27.0.12077973" \
              "cmake;3.22.1"
          }
          for attempt in 1 2 3; do
            if install_android_packages; then
              exit 0
            fi
            echo "SDK installation attempt ${attempt} failed; retrying..."
            sleep $((attempt * 10))
          done
          echo 'Android SDK/NDK/CMake installation failed after 3 attempts.'
          exit 1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          cd "$MISTY_PROJECT_DIR"
          chmod +x ./gradlew
          test -s gradle/wrapper/gradle-wrapper.jar
          test -s gradle/wrapper/gradle-wrapper.properties
          echo 'Gradle wrapper files verified.'
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Build MISTY Debug APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          cd "$MISTY_PROJECT_DIR"
          ./gradlew --no-daemon --stacktrace --max-workers=2 clean assembleDebug
          test -n "$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f -print -quit)"
          echo 'APK build completed.'

      - name: Run unit tests (reported separately)
        if: success()
        continue-on-error: true
        shell: bash
        run: |
          cd "$MISTY_PROJECT_DIR"
          ./gradlew --no-daemon --stacktrace --max-workers=2 testDebugUnitTest

      - name: Upload MISTY APK
        if: steps.apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: MISTY-Android-APK
          path: ${{ env.MISTY_PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostic reports if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MISTY-Build-Diagnostics
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
